name: Lint Python Code

on:
    pull_request:
        branches:
            - master
    push:
        branches:
            - master
    workflow_dispatch:


jobs:
    lint: # the name of the job
        runs-on: ubuntu-latest  #runner
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v4
              with:
                python-version: "3.11"
                cache: "pip"  
                #caches the pip dependencu of any installed packages
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                python -m pip install ruff
                if [ -f requirements.txt ]; them python -m pip install -r requirements.txt; fi
            - name: Run Ruff
              run: ruff check --output-format=github . #easier to understand